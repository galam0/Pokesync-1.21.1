plugins {
    id 'java'
    id "com.github.johnrengelman.shadow" version "8.1.1"
    // 마인크래프트 본체 코드를 불러와주는 Paperweight 플러그인 추가
    id("io.papermc.paperweight.userdev") version "1.7.3"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots' }
    maven { url = 'https://repo.william278.net/releases' }
}

dependencies {
    paperweight.paperDevBundle("1.21.1-R0.1-SNAPSHOT")
    compileOnly files("${rootDir}/libs/Pixelmon-1.21.1-9.3.16-universal.jar")

    // HuskSync를 메이븐 저장소에서 컴파일 전용으로 안전하게 불러오기
    compileOnly "net.william278.husksync:husksync-bukkit:3.6.8"
}

shadowJar {
    zip64 = true
    archiveClassifier.set('')
    archiveBaseName.set("${rootProject.name}")
}

tasks.build {
    dependsOn tasks.shadowJar
}